services:
  subs-backend:
    build: .
    container_name: subs-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Copenhagen
    # Bound to localhost only — expose publicly via Cloudflare Tunnel / proxy,
    # never directly to the internet (the API is currently unauthenticated).
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db
